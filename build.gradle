plugins {
    id 'java'
    id 'com.hypherionmc.modutils.modpublisher' version "2.+"
}

version = mod_version

// No Java sources — datapack-only mod
sourceSets {
    main {
        java { srcDirs = [] }
        resources { srcDirs = ['src/main/resources'] }
    }
    test { }
}

jar {
    // Change the filename here — default: "${mod_id}-${mod_version}.jar"
    archiveFileName = "${mod_id}-fabric-neoforge-${mod_version}.jar"

    // Expand all gradle.properties tokens into metadata files
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand project.properties
    }

    manifest {
        attributes 'Manifest-Version': '1.0'
    }
}

// No compilation or tests needed
compileJava.enabled          = false
processTestResources.enabled = false
testClasses.enabled          = false

publisher {
    // Setup the required API keys. You only need to define the keys for
    // the platforms you plan on uploading to
    apiKeys {
        modrinth (providers.gradleProperty("modrinthToken").orElse(System.getenv("MODRINTH_TOKEN")).get())
        curseforge (providers.gradleProperty("curseToken").orElse(System.getenv("CURSE_TOKEN")).get())
    }

    // Enable Debug mode. When enabled, no files will actually be uploaded
    setDebug(true)

    // Curseforge Project ID
    setCurseID("626761")

    // Modrinth Project ID
    setModrinthID("DjLobEOy")

    // Type of release. beta, alpha or release
    // You can also use VersionType.BETA, VersionType.ALPHA or VersionType.RELEASE
    setVersionType("release")

    // Required for Modrinth/GitHub
    setProjectVersion("${project.version}")

    // Fancy display name for the upload.
    // Will default to the project version if not set
    setDisplayName("(${project.minecraft_version}) Towns and Towers ${project.version} (NeoForge/Fabric/Quilt)")

    // The supported game versions
    setGameVersions("${project.minecraft_version}")

    // The modloaders your upload supports.
    // This can also be an Enum from ModLoader,
    // like setLoaders(ModLoader.FABRIC, ModLoader.FORGE)
    setLoaders("fabric", "quilt", "neoforge")

    // The new Curseforge Environment tag. Optional
    // Valid values are "server", "client" or "both"
    // You can also use CurseEnvironment.BOTH, or CurseEnvironment.SERVER or CurseEnvironment.CLIENT
    setCurseEnvironment("both")

    // Upload the release, but keep it "private" until you are ready
    // Unreleased feature on CurseForge, working on Modrinth
    setIsManualRelease(false)

    // The file to be uploaded. This can be a file, task, or string.
    // setArtifact("build/libs/mymod.jar")
    // setArtifact(jar.getArchiveFile().get())
    // If this is a task, the task specified will be executed before publishing
    setArtifact(tasks.jar)

    // Disable the built in Fractureizer scanner
    setDisableMalwareScanner(true)

    curseDepends {
        required "cristel-lib"
    }
    modrinthDepends {
        required "cristel-lib"
    }

    // Add supported java versions. Currently only used by CurseForge
    // Supports anything that can be parsed using JavaVersion.toVersion()
    setJavaVersions([("VERSION_" + java_version)])
}

def changelogSource = rootProject.file("CHANGELOG.md")
def changelogOutput = layout.buildDirectory.file("changelog.md")

tasks.register("generateChangelog") {
    inputs.file(changelogSource)
    inputs.property('version', project.version)
    outputs.file(changelogOutput)
    doLast {
        if (!changelogSource.exists()) {
            throw new GradleException("Missing CHANGELOG.md at ${changelogSource}")
        }

        def lines = changelogSource.readLines("UTF-8")
        def versionHeader = "## [${project.version}]"
        def versionHeaderAlt = "## ${project.version}"
        int start = -1
        for (int i = 0; i < lines.size(); i++) {
            if (lines[i].startsWith(versionHeader) || lines[i].startsWith(versionHeaderAlt)) {
                start = i
                break
            }
        }
        if (start == -1) {
            def outFile = changelogOutput.get().asFile
            outFile.parentFile.mkdirs()
            outFile.text = ""
            return
        }

        int end = lines.size()
        for (int i = start + 1; i < lines.size(); i++) {
            if (lines[i].startsWith("## ")) {
                end = i
                break
            }
        }

        def section = lines.subList(start + 1, end).join(System.lineSeparator()).trim()
        def outFile = changelogOutput.get().getAsFile()
        outFile.parentFile.mkdirs()
        outFile.text = section + System.lineSeparator()
    }
}

tasks.matching { it.name in ["publishMod", "publishModrinth", "publishCurseforge", "publishGitHub"] }.configureEach {
    dependsOn("generateChangelog")
}

plugins.withId("com.hypherionmc.modutils.modpublisher") {
    publisher {
        setChangelog(changelogOutput.get().getAsFile())
    }
}